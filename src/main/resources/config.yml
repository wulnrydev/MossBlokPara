# -----------------------------------------------
# DEBUG MODU
# -----------------------------------------------
# true yapılırsa, mossblokpara.admin iznine sahip
# oyuncular blok kırdığında neden para almadıklarını
# chat'te görebilir. Sorun tespiti için kullan.
# -----------------------------------------------
debug: false

# -----------------------------------------------
# MESAJ AYARLARI
# -----------------------------------------------
# Renk kodları: &x -> standart, &#RRGGBB -> hex
# Örnek prefix: &#15FF08&lBoxPvP &8▸
# -----------------------------------------------
messages:
  # Para kazanıldığında oyuncuya gönderilen mesaj.
  # Kullanılabilir değişkenler:
  #   {block}   -> Kırılan bloğun görünen ismi
  #   {amount}  -> Kazanılan para miktarı
  #   {balance} -> Oyuncunun güncel bakiyesi
  reward: "&#15FF08&lBoxPvP &8▸ &7Başarıyla &#00D420{block} &7kırdın ve hesabına &#ffd500{amount} TL &7eklendi."

  # Yeniden yükleme başarılı mesajı (sadece admin görür)
  reload-success: "&#15FF08&lBoxPvP &8▸ &#00D420Yapılandırma dosyası başarıyla yeniden yüklendi."

  # Yeniden yükleme başarısız mesajı
  reload-fail: "&#15FF08&lBoxPvP &8▸ &cYapılandırma yüklenirken bir hata oluştu! Konsolu kontrol et."

  # Yetersiz izin mesajı
  no-permission: "&#15FF08&lBoxPvP &8▸ &cBu komutu kullanmak için yeterli iznin yok."

# -----------------------------------------------
# WORLDGUARD BÖLGELERİ
# -----------------------------------------------
# Para sisteminin çalışacağı WorldGuard region
# isimlerini buraya girin. Büyük/küçük harf
# DİKKATLİ ayarlanmalı (region isimleri küçük harf).
# -----------------------------------------------
regions:
  - "anapvp"
  - "guvenlimaden"
  # İstediğiniz kadar region ekleyebilirsiniz.
  # - "baska_bolge"

# -----------------------------------------------
# BLOK AYARLARI
# -----------------------------------------------
# Her blok için ayrı ayar yapabilirsiniz.
#
# Alanlar:
#   display-name  -> Mesajda görünecek blok adı
#   chance        -> Para düşme yüzdesi (0.0 - 100.0)
#   min-amount    -> Minimum para miktarı
#   max-amount    -> Maksimum para miktarı
#                   (min == max ise sabit miktar)
#
# Blok ismi için Bukkit Material enum değerini kullanın.
# Tam liste: https://jd.papermc.io/paper/1.21/org/bukkit/Material.html
# -----------------------------------------------
blocks:
  DIAMOND_ORE:
    display-name: "Elmas Cevheri"
    chance: 10.0
    min-amount: 0.01
    max-amount: 0.09

